# ===================================
# APPLICATION
# ===================================
spring.application.name=API-GATEWAY
server.port=8080

# ===================================
# EUREKA
# ===================================
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

eureka.instance.hostname=localhost
eureka.instance.prefer-ip-address=false
eureka.instance.instance-id=${spring.application.name}:${server.port}

# ===================================
# DISCOVERY LOCATOR
# ===================================
spring.cloud.gateway.discovery.locator.enabled=true
spring.cloud.gateway.discovery.locator.lower-case-service-id=false

# ===================================
# BUSINESS ROUTES
# ===================================

# Customer Service
spring.cloud.gateway.routes[0].id=customer-service
spring.cloud.gateway.routes[0].uri=lb://CUSTOMER-SERVICE
spring.cloud.gateway.routes[0].predicates[0]=Path=/customers/**

# Pet Service
spring.cloud.gateway.routes[1].id=pet-service
spring.cloud.gateway.routes[1].uri=lb://CUSTOMER-SERVICE
spring.cloud.gateway.routes[1].predicates[0]=Path=/pets/**

# Vet Service
spring.cloud.gateway.routes[2].id=vet-service
spring.cloud.gateway.routes[2].uri=lb://VET-SERVICE
spring.cloud.gateway.routes[2].predicates[0]=Path=/vets/**

# Appointment Service
spring.cloud.gateway.routes[3].id=appointment-service
spring.cloud.gateway.routes[3].uri=lb://VISIT-SERVICE
spring.cloud.gateway.routes[3].predicates[0]=Path=/appointments/**

# Visit Service
spring.cloud.gateway.routes[4].id=visit-service
spring.cloud.gateway.routes[4].uri=lb://VISIT-SERVICE
spring.cloud.gateway.routes[4].predicates[0]=Path=/visits/**

# Admin Service
spring.cloud.gateway.routes[5].id=admin-service
spring.cloud.gateway.routes[5].uri=lb://ADMIN-SERVICE
spring.cloud.gateway.routes[5].predicates[0]=Path=/admins/**

# Security Service
spring.cloud.gateway.routes[6].id=security-service
spring.cloud.gateway.routes[6].uri=lb://SECURITY-SERVICE
spring.cloud.gateway.routes[6].predicates[0]=Path=/auth/**

spring.cloud.gateway.routes[13].id=user-service
spring.cloud.gateway.routes[13].uri=lb://USER-SERVICE
spring.cloud.gateway.routes[13].predicates[0]=Path=/users/**
# ===================================
# SWAGGER DOC ROUTES
# ===================================

# Customer Docs
spring.cloud.gateway.routes[7].id=customer-docs
spring.cloud.gateway.routes[7].uri=lb://CUSTOMER-SERVICE
spring.cloud.gateway.routes[7].predicates[0]=Path=/CUSTOMER-SERVICE/v3/api-docs
spring.cloud.gateway.routes[7].filters[0]=SetPath=/v3/api-docs

# Vet Docs
spring.cloud.gateway.routes[8].id=vet-docs
spring.cloud.gateway.routes[8].uri=lb://VET-SERVICE
spring.cloud.gateway.routes[8].predicates[0]=Path=/VET-SERVICE/v3/api-docs
spring.cloud.gateway.routes[8].filters[0]=SetPath=/v3/api-docs

# Visit Docs
spring.cloud.gateway.routes[9].id=visit-docs
spring.cloud.gateway.routes[9].uri=lb://VISIT-SERVICE
spring.cloud.gateway.routes[9].predicates[0]=Path=/VISIT-SERVICE/v3/api-docs
spring.cloud.gateway.routes[9].filters[0]=SetPath=/v3/api-docs

# Admin Docs
spring.cloud.gateway.routes[10].id=admin-docs
spring.cloud.gateway.routes[10].uri=lb://ADMIN-SERVICE
spring.cloud.gateway.routes[10].predicates[0]=Path=/ADMIN-SERVICE/v3/api-docs
spring.cloud.gateway.routes[10].filters[0]=SetPath=/v3/api-docs

# Security Docs
spring.cloud.gateway.routes[11].id=security-docs
spring.cloud.gateway.routes[11].uri=lb://SECURITY-SERVICE
spring.cloud.gateway.routes[11].predicates[0]=Path=/SECURITY-SERVICE/v3/api-docs
spring.cloud.gateway.routes[11].filters[0]=SetPath=/v3/api-docs

# User Docs
spring.cloud.gateway.routes[12].id=user-docs
spring.cloud.gateway.routes[12].uri=lb://USER-SERVICE
spring.cloud.gateway.routes[12].predicates[0]=Path=/USER-SERVICE/v3/api-docs
spring.cloud.gateway.routes[12].filters[0]=SetPath=/v3/api-docs

# ===================================
# SPRINGDOC
# ===================================
springdoc.api-docs.enabled=true
springdoc.api-docs.path=/v3/api-docs

springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/swagger-ui.html

# Aggregated Services
springdoc.swagger-ui.urls[0].name=Customer Service
springdoc.swagger-ui.urls[0].url=/CUSTOMER-SERVICE/v3/api-docs

springdoc.swagger-ui.urls[1].name=Vet Service
springdoc.swagger-ui.urls[1].url=/VET-SERVICE/v3/api-docs

springdoc.swagger-ui.urls[2].name=Visit Service
springdoc.swagger-ui.urls[2].url=/VISIT-SERVICE/v3/api-docs

springdoc.swagger-ui.urls[3].name=Admin Service
springdoc.swagger-ui.urls[3].url=/ADMIN-SERVICE/v3/api-docs

springdoc.swagger-ui.urls[4].name=Security Service
springdoc.swagger-ui.urls[4].url=/SECURITY-SERVICE/v3/api-docs

springdoc.swagger-ui.urls[5].name=User Service
springdoc.swagger-ui.urls[5].url=/USER-SERVICE/v3/api-docs

# ===================================
# ACTUATOR
# ===================================
management.endpoints.web.exposure.include=*

# ===================================
# LOGGING
# ===================================
logging.level.org.springframework.cloud.gateway=DEBUG
logging.level.reactor.netty=INFO
logging.level.org.springdoc=DEBUG

# ===================================
# JWT
# ===================================
jwt.secret=MyPetClinicSecretKeyMyPetClinicSecretKey123456